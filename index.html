<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>كتالوج التصاميم | عِزوة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      background: radial-gradient(circle at top, #1d1916 0%, #0d0d0d 70%);
      color: #f5f5f4;
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 14px;
      user-select: none;
    }

    .glass-panel {
      background: rgba(24, 22, 21, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 175, 55, 0.28);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      width: 100%;
      max-width: 440px;
    }

    .btn {
      background: rgba(26, 24, 23, 0.95);
      color: #f5f5f4;
      border: 1px solid rgba(212, 175, 55, 0.35);
      padding: 8px 13px;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn.gold {
      background: #d4af37;
      color: #121212;
      font-weight: 700;
      border-color: #d4af37;
    }

    .book-stage {
      width: min(92vw, 420px);
      height: min(68dvh, 540px);
      perspective: 1700px;
      position: relative;
      touch-action: pan-y;
    }

    .page-card {
      width: 100%;
      height: 100%;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transform-origin: right center;
      transform-style: preserve-3d;
      box-shadow: 0 24px 55px rgba(0, 0, 0, 0.8);
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
      position: relative;
    }

    .page-card::after {
      content: "";
      position: absolute;
      top: 8px;
      bottom: 8px;
      right: 0;
      width: 14px;
      border-radius: 0 20px 20px 0;
      background: linear-gradient(to left, rgba(212, 175, 55, 0.18), transparent);
      pointer-events: none;
    }

    .page-card.flip-next {
      transform: rotateY(-78deg) scale(0.97);
      opacity: 0.3;
    }

    .page-card.flip-prev {
      transform: rotateY(78deg) scale(0.97);
      opacity: 0.3;
    }

    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .page-title {
      font-size: 17px;
      font-weight: 800;
      color: #d4af37;
      line-height: 1.3;
    }

    .page-subtitle {
      font-size: 12.5px;
      color: #a8a29e;
      margin-top: 2px;
    }

    .design-frame {
      position: relative;
      flex: 1;
      background: #0e0d0c;
      border-radius: 15px;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 12px 0;
    }

    .design-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .zoom-detail-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 6;
      background: rgba(16, 16, 16, 0.88);
      color: #d4af37;
      border: 1px solid rgba(212, 175, 55, 0.6);
      border-radius: 999px;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    .zoom-detail-btn:hover {
      background: rgba(212, 175, 55, 0.18);
    }

    .zoom-detail-btn:active {
      transform: scale(0.96);
    }

    .page-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12.5px;
      color: #a8a29e;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: min(94vw, 560px);
      max-height: 90dvh;
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-img-wrap {
      max-height: 58dvh;
      overflow: auto;
      background: #0b0b0b;
      border-radius: 12px;
      border: 1px solid rgba(212, 175, 55, 0.18);
      padding: 10px;
      text-align: center;
    }

    .modal-img-wrap img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      transition: transform 0.25s ease;
      transform-origin: center center;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <button class="btn" onclick="prevPage()">→ السابقة</button>
    <button class="btn gold" onclick="nextPage()">التالية ←</button>
    <button class="btn" id="soundToggle" onclick="toggleSound()">🔊 الصوت: مفعّل</button>
  </div>

  <div class="book-stage" id="bookStage">
    <article class="page-card glass-panel" id="pageCard">
      <div class="page-header">
        <div>
          <div class="page-title" id="pageTitle"></div>
          <div class="page-subtitle" id="pageSubtitle"></div>
        </div>
      </div>

      <div class="design-frame">
        <button class="zoom-detail-btn" type="button" onclick="openDetailModal()">🔍 معاينة التفاصيل</button>
        <img id="pageImage" src="" alt="تصميم الكتالوج" />
      </div>

      <div class="page-footer">
        <span id="pageCounter"></span>
        <span>اسحب يمينًا أو يسارًا للتقليب</span>
      </div>
    </article>
  </div>

  <div class="modal-backdrop" id="detailModal" onclick="closeDetailModal()">
    <div class="modal-box glass-panel" onclick="event.stopPropagation()">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <strong id="modalTitle" style="color:#d4af37; font-size:15px;"></strong>
        <button class="btn" type="button" onclick="closeDetailModal()">إغلاق ✕</button>
      </div>
      <div class="modal-img-wrap">
        <img id="modalImage" src="" alt="تفاصيل التصميم المكبرة" />
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
        <span id="modalDesc" style="font-size:12.5px; color:#d6d3d1;"></span>
        <button class="btn gold" type="button" id="modalZoomBtn" onclick="toggleModalZoom()">تكبير التفاصيل</button>
      </div>
    </div>
  </div>

  <script>
    // استبدل عناصر المصفوفة التالية بصور تصاميمك الفعلية في الكتالوج
    const catalogPages = [
      {
        title: "تصميم 01 — الواجهة الأمامية",
        subtitle: "مقاس صدر / شعار واضح",
        desc: "معاينة مكبرة لوضوح الحواف وتفاصيل الخط قبل الطباعة.",
        img: "https://via.placeholder.com/800x950/171514/d4af37?text=Design+01"
      },
      {
        title: "تصميم 02 — الظهر الكامل",
        subtitle: "تكوين متوازن ومساحة طباعة واسعة",
        desc: "تفقد دقة العناصر والخطوط الدقيقة عند التكبير.",
        img: "https://via.placeholder.com/800x950/171514/f5f5f4?text=Design+02"
      },
      {
        title: "تصميم 03 — تفصيل الكم",
        subtitle: "شعار جانبي متناسق",
        desc: "مناسب للكم الأيمن أو الأيسر بمقاس متوازن.",
        img: "https://via.placeholder.com/800x950/171514/d4af37?text=Design+03"
      }
    ];

    let currentIndex = 0;
    let isFlipping = false;
    let soundEnabled = true;
    let modalZoomed = false;
    let audioCtx = null;

    function playPageTurnSound() {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        const duration = 0.14;
        const bufferSize = Math.floor(audioCtx.sampleRate * duration);
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
          const env = Math.sin((i / bufferSize) * Math.PI);
          data[i] = (Math.random() * 2 - 1) * env * 0.25;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(1400, audioCtx.currentTime);
        filter.Q.setValueAtTime(0.8, audioCtx.currentTime);

        noise.connect(filter);
        filter.connect(audioCtx.destination);
        noise.start();
      } catch (e) {}
    }

    function renderPage() {
      const page = catalogPages[currentIndex];
      document.getElementById("pageTitle").textContent = page.title;
      document.getElementById("pageSubtitle").textContent = page.subtitle;
      document.getElementById("pageImage").src = page.img;
      document.getElementById("pageCounter").textContent = `صفحة ${currentIndex + 1} من ${catalogPages.length}`;
    }

    function flipTo(newIndex, direction) {
      if (isFlipping || catalogPages.length <= 1) return;
      isFlipping = true;

      const card = document.getElementById("pageCard");
      playPageTurnSound();
      card.classList.add(direction === "next" ? "flip-next" : "flip-prev");

      setTimeout(() => {
        currentIndex = newIndex;
        renderPage();
        card.classList.remove("flip-next", "flip-prev");
        isFlipping = false;
      }, 260);
    }

    function nextPage() {
      const next = (currentIndex + 1) % catalogPages.length;
      flipTo(next, "next");
    }

    function prevPage() {
      const prev = (currentIndex - 1 + catalogPages.length) % catalogPages.length;
      flipTo(prev, "prev");
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById("soundToggle").textContent = soundEnabled ? "🔊 الصوت: مفعّل" : "🔇 الصوت: مكتوم";
    }

    let pointerStartX = null;
    const bookStage = document.getElementById("bookStage");

    bookStage.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".zoom-detail-btn")) return;
      pointerStartX = e.clientX;
    });

    bookStage.addEventListener("pointerup", (e) => {
      if (pointerStartX === null) return;
      const diff = e.clientX - pointerStartX;
      pointerStartX = null;
      if (diff < -40) nextPage();
      else if (diff > 40) prevPage();
    });

    function openDetailModal() {
      const page = catalogPages[currentIndex];
      modalZoomed = false;
      document.getElementById("modalTitle").textContent = page.title;
      document.getElementById("modalDesc").textContent = page.desc;
      const img = document.getElementById("modalImage");
      img.src = page.img;
      img.style.transform = "scale(1)";
      document.getElementById("modalZoomBtn").textContent = "تكبير التفاصيل";
      document.getElementById("detailModal").classList.add("open");
    }

    function closeDetailModal() {
      document.getElementById("detailModal").classList.remove("open");
    }

    function toggleModalZoom() {
      modalZoomed = !modalZoomed;
      const img = document.getElementById("modalImage");
      const btn = document.getElementById("modalZoomBtn");
      img.style.transform = modalZoomed ? "scale(1.7)" : "scale(1)";
      btn.textContent = modalZoomed ? "تصغير التفاصيل" : "تكبير التفاصيل";
    }

    renderPage();
  </script>
</body>
</html>
